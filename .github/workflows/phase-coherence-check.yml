name: Coherence-phase peak response check

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/bound_phase_peak_response.py'
      - 'src/walk_phase_response.py'
      - 'src/bound_coherence_determinant.py'
      - 'scripts/benchmark_bound_phase_peak_response.py'
      - 'scripts/benchmark_walk_phase_response.py'
      - 'tests/test_bound_phase_peak_response.py'
      - 'tests/test_walk_phase_response.py'
      - '.github/workflows/phase-coherence-check.yml'

permissions:
  contents: read

jobs:
  phase-response:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install numerical requirements
        run: python -m pip install -r requirements.txt
      - name: Validate phase susceptibility and determinant algebra
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python -m pytest -q tests/test_bound_phase_peak_response.py tests/test_walk_phase_response.py
      - name: Benchmark phase-controlled peaks and held-out angles
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python scripts/benchmark_bound_phase_peak_response.py
      - name: Benchmark scattering-only finite-walk phase peak predictions
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python scripts/benchmark_walk_phase_response.py
      - name: Export reproducible data and graphics
        uses: actions/upload-artifact@v4
        with:
          name: phase-coherence-revival-response
          path: |
            results/bound_phase_peak_susceptibility.csv
            results/bound_phase_fourier_heldout.csv
            figures/bound_phase_peak_shift_prediction.png
            figures/bound_phase_harmonic_compression.png
            results/walk_phase_peak_response.csv
            figures/walk_phase_peak_response.png
          if-no-files-found: error
