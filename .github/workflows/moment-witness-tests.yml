name: Analytical clean-witness moment regression
on:
  push:
    paths:
      - 'research/phase-revivals/moment_witness/**'
      - 'research/phase-revivals/clean_witness/**'
      - 'research/phase-revivals/hermite_airy/**'
      - '.github/workflows/moment-witness-tests.yml'
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy pytest
      - name: Mathematical and numerical checks
        env:
          OPENBLAS_NUM_THREADS: '1'
          PYTHONPATH: './research/phase-revivals/moment_witness:./research/phase-revivals/clean_witness:./research/phase-revivals/hermite_airy:./research/phase-revivals/self_consistent_return:./research/phase-revivals/certificate:./research/phase-revivals/certificate/src:./research/phase-revivals/capacity_geometry'
        run: python -m pytest -q research/phase-revivals/moment_witness/test_moment_witness.py
