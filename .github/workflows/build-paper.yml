# This workflow turns LaTeX source into a PDF on GitHub's computer.
# Read this file from top to bottom to see each step of the build.
name: Build Ising research paper

on:
  push:
    branches: [main]
    paths:
      - "paper/**"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/build-paper.yml"
  workflow_dispatch: # Also allows a manual "Run workflow" button.

permissions:
  contents: read # We only read the repository; we do not push generated files.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 1 - Get the repository files
        uses: actions/checkout@v4

      - name: 2 - Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 3 - Install the Python requirements
        run: python -m pip install -r requirements.txt

      - name: 4 - Check the physics code
        run: python -m pytest -q

      - name: 5 - Generate the figure used in the paper
        run: python scripts/run_experiment.py

      - name: 5b - Generate the exploratory quench trajectories
        run: python scripts/run_quench.py

      - name: 5c - Test matched-transmission phase-sensitive defects
        run: python scripts/run_phase_revivals.py

      - name: 5d - Verify scattering-phase wavepacket arrival delays
        run: python scripts/validate_phase_delay.py

      - name: 5e - Benchmark first broad capacity revivals
        run: python scripts/benchmark_first_revival.py

      - name: 5f - Bound-state spectral mechanism audit
        run: python scripts/run_bound_state_diagnostics.py

      - name: 5g - Validate two-site scattering resummation and bound poles
        run: python scripts/run_tmatrix_experiment.py

      - name: 5h - Benchmark unitary rank-two time propagators
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: python scripts/benchmark_reduced_time_propagators.py

      - name: 5i - Verify coherent boundary returns and two-site Volterra dynamics
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: python scripts/benchmark_boundary_image_volterra.py

      - name: 5j - Predict capacity reversal contrast from symmetric linear response
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: python scripts/benchmark_capacity_asymmetry_response.py

      - name: 5k - Verify exact parity-resummed defect scattering
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: python scripts/benchmark_parity_resummation.py

      - name: 5l - Test analytical first capacity-peak time and height formula
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: python scripts/benchmark_capacity_peak_response.py

      - name: 6 - Compile the LaTeX paper
        uses: xu-cheng/latex-action@v4
        with:
          root_file: paper/main.tex
          work_in_root_file_dir: true

      - name: 7 - Confirm that a nonempty PDF exists
        run: test -s paper/main.pdf

      - name: 8 - Publish a directly viewable PDF as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ising-research-paper
          path: paper/main.pdf
          archive: false
          if-no-files-found: error

      - name: 9 - Upload quench time-series CSV
        uses: actions/upload-artifact@v7
        with:
          name: quench-timeseries-csv
          path: results/quench_trajectory.csv
          archive: false
          if-no-files-found: error

      - name: 10 - Upload exploratory quench figure
        uses: actions/upload-artifact@v7
        with:
          name: quench-figure-png
          path: figures/quench_dynamics.png
          archive: false
          if-no-files-found: error

      - name: 11 - Upload scattering-phase pilot results
        uses: actions/upload-artifact@v7
        with:
          name: phase-pilot-data
          path: |
            results/phase_revival_pilot.csv
            results/two_site_scattering.csv
            figures/phase_revival_pilot.png
          if-no-files-found: error

      - name: 12 - Upload phase-delay benchmark data
        uses: actions/upload-artifact@v7
        with:
          name: phase-delay-wavepacket
          path: |
            results/wavepacket_phase_delay.csv
            figures/wavepacket_phase_delay.png
          if-no-files-found: error

      - name: 13 - Upload first-revival benchmark
        uses: actions/upload-artifact@v7
        with:
          name: first-revival-benchmark
          path: |
            results/first_revival_benchmark.csv
            figures/first_revival_benchmark.png
          if-no-files-found: error

      - name: 14 - Upload bound-state audit
        uses: actions/upload-artifact@v7
        with:
          name: bound-state-spectral-audit
          path: |
            results/bound_state_spectral_summary.csv
            results/bound_state_trajectories.csv
            figures/bound_state_phase_ablation.png
          if-no-files-found: error

      - name: 15 - Upload T-matrix scattering diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: coherent-scattering-tmatrix
          path: |
            results/tmatrix_bound_poles.csv
            results/tmatrix_scattering_convergence.csv
            figures/tmatrix_scattering_poles.png
          if-no-files-found: error

      - name: 16 - Upload time-domain numerical benchmark
        uses: actions/upload-artifact@v7
        with:
          name: rank-two-time-domain-benchmark
          path: |
            results/reduced_time_propagator_benchmark.csv
            figures/reduced_time_propagator_comparison.png
            figures/reduced_time_step_convergence.png
          if-no-files-found: error

      - name: 17 - Upload boundary-return Volterra benchmark
        uses: actions/upload-artifact@v7
        with:
          name: boundary-return-volterra
          path: |
            results/boundary_image_volterra_benchmark.csv
            figures/boundary_image_volterra_capacity.png
            figures/boundary_image_propagator_error.png
          if-no-files-found: error

      - name: 18 - Upload capacity asymmetry response benchmark
        uses: actions/upload-artifact@v7
        with:
          name: capacity-asymmetry-linear-response
          path: |
            results/capacity_asymmetry_linear_response.csv
            results/capacity_asymmetry_example.csv
            figures/capacity_asymmetry_response.png
            figures/capacity_asymmetry_error_scaling.png
          if-no-files-found: error

      - name: 19 - Upload strong-asymmetry parity-channel results
        uses: actions/upload-artifact@v7
        with:
          name: parity-channel-resummation
          path: |
            results/parity_resummation_benchmark.csv
            results/parity_bound_energy_predictions.csv
            figures/parity_resummation_error.png
            figures/parity_channel_dressing.png
          if-no-files-found: error

      - name: 20 - Upload analytical peak predictions
        uses: actions/upload-artifact@v7
        with:
          name: capacity-peak-formula
          path: |
            results/capacity_peak_response_benchmark.csv
            figures/capacity_peak_shift_prediction.png
            figures/capacity_peak_height_prediction.png
          if-no-files-found: error
