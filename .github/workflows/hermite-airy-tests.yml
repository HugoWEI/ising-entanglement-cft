name: Hermite Airy first-return tests
on:
  push:
    paths:
      - 'research/phase-revivals/hermite_airy/**'
      - 'research/phase-revivals/certificate/**'
      - 'research/phase-revivals/self_consistent_return/**'
      - 'research/phase-revivals/capacity_geometry/**'
      - '.github/workflows/hermite-airy-tests.yml'
  pull_request:
    paths:
      - 'research/phase-revivals/hermite_airy/**'
      - 'research/phase-revivals/certificate/**'
      - 'research/phase-revivals/self_consistent_return/**'
      - 'research/phase-revivals/capacity_geometry/**'
  workflow_dispatch:

jobs:
  numerical-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy matplotlib pytest mpmath
      - name: Run five Hermite Airy numerical regression tests
        working-directory: research/phase-revivals/hermite_airy
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m pytest -q test_hermite_airy_solver.py
